name: speedx
base: core22
version: '2026.10.2'
summary: Internet speed test, live network monitor and system monitor
description: |
  **SpeedX** shows how fast your internet really is, and what your computer is
  doing, in one clean, lightweight app.

  **Internet speed test**
  - Measure download, upload, ping and jitter in about 20 seconds
  - Automatic background tests every 1 to 24 hours, with a speed-over-time chart
  - Alerts when your speed drops far below normal, with CSV export as proof for your ISP

  **Live speed in your top bar**
  - Real-time download and upload speed next to the clock (Ubuntu, GNOME, XFCE, MATE)
  - Always-on-top mini speed meter you can place anywhere

  **Connection quality and outages**
  - Latency, jitter and packet loss, measured continuously
  - Outage log with notifications when your internet drops and comes back
  - Wi-Fi details: network name, signal strength, 2.4/5/6 GHz band, channel and link rate

  **Data usage**
  - Daily and monthly usage, including traffic while SpeedX was closed
  - Monthly data cap with billing day and warnings at 80% and 100%

  **System monitor**
  - CPU (per core, frequency, temperature), memory, disks and network graphs
  - 30 days of history: see what happened while you were away
  - Battery health, charge cycles, power draw and time remaining
  - Process manager that groups processes by app, so you can close a whole app at once

  Dark and light themes, launch at login, and no account needed. Your data stays
  on your computer.

  For CPU temperature, disk, battery and Wi-Fi details, connect the optional
  interfaces:
    sudo snap connect speedx:hardware-observe
    sudo snap connect speedx:network-manager-observe
grade: stable
confinement: strict

icon: snap/gui/icon.png

architectures:
  - build-on: [amd64]

environment:
  SNAP_DESKTOP_RUNTIME: $SNAP/pyqt5-runtime-core22-lite

apps:
  speedx:
    command: bin/desktop-launch python3 $SNAP/speedx.py
    plugs:
      - home
      - gsettings
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - x11
      - unity7
      - wayland
      - opengl
      - hardware-observe
      - network-status
      - network-observe
      - network-manager-observe
      - system-observe
      - mount-observe
      - process-control
    desktop: speedx.desktop
    autostart: speedx.desktop
    environment:
      DISABLE_WAYLAND: 1

plugs:
  gsettings:
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes
  pyqt5-runtime-core22-lite:
    interface: content
    target: $SNAP/pyqt5-runtime-core22-lite
    default-provider: pyqt5-runtime-core22-lite


parts:
  desktop-gui:
    plugin: dump
    source: src/
    override-build: |
      snapcraftctl build
      sed -i 's|Icon=.*|Icon=${SNAP}/meta/gui/icon.png|g' ${SNAPCRAFT_PART_SRC}/speedx.desktop
      mkdir -p ${SNAPCRAFT_PART_INSTALL}/usr/share/applications/
      cp -rf ${SNAPCRAFT_PART_SRC}/speedx.desktop ${SNAPCRAFT_PART_INSTALL}/usr/share/applications/speedx.desktop


  snap-launcher:
    plugin: dump
    source: snap_launcher/

  speedx:
      plugin: python
      source: .
      python-packages:
        - psutil
        - jeepney